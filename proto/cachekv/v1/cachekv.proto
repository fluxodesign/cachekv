syntax = "proto3";

package cachekv.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/fluxodesign/cachekv/gen/cachekv/v1;cachekvv1";

// CacheKV exposes the cachekv library's database, entry, configuration, and
// metrics operations over gRPC.
service CacheKV {
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);
  rpc InsertEntry(InsertEntryRequest) returns (InsertEntryResponse);
  rpc UpdateEntry(UpdateEntryRequest) returns (UpdateEntryResponse);
  rpc RemoveEntry(RemoveEntryRequest) returns (RemoveEntryResponse);
  rpc BatchInsert(BatchInsertRequest) returns (BatchInsertResponse);
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);
  rpc GetAll(GetAllRequest) returns (stream Entry);
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  rpc ListConfigurations(ListConfigurationsRequest) returns (ListConfigurationsResponse);
  rpc UpdateConfigurations(UpdateConfigurationsRequest) returns (UpdateConfigurationsResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc Ping(PingRequest) returns (PingResponse);
}

// Entry is a single key/value pair.
message Entry {
  string key = 1;
  bytes value = 2;
}

message CreateDatabaseRequest {
  string db_name = 1;
  bool secure = 2;
}

message CreateDatabaseResponse {}

message InsertEntryRequest {
  string db_name = 1;
  string key = 2;
  bytes value = 3;
}

message InsertEntryResponse {}

message UpdateEntryRequest {
  string db_name = 1;
  string key = 2;
  bytes value = 3;
}

message UpdateEntryResponse {}

message RemoveEntryRequest {
  string db_name = 1;
  string key = 2;
}

message RemoveEntryResponse {}

message BatchInsertRequest {
  string db_name = 1;
  repeated Entry entries = 2;
}

message BatchInsertResponse {
  int32 count = 1;
}

message GetEntryRequest {
  string db_name = 1;
  string key = 2;
}

message GetEntryResponse {
  bytes value = 1;
}

message GetAllRequest {
  string db_name = 1;
}

message ListDatabasesRequest {}

message ListDatabasesResponse {
  repeated string names = 1;
}

// ConfigMessage mirrors cachekv.Config.
message ConfigMessage {
  string store_path = 1;
  bool secure_new_db = 2;
  string meta_store = 3;
  string meta_file = 4;
}

message ListConfigurationsRequest {}

message ListConfigurationsResponse {
  ConfigMessage config = 1;
}

message UpdateConfigurationsRequest {
  ConfigMessage config = 1;
}

message UpdateConfigurationsResponse {}

message GetMetricsRequest {}

// GetMetricsResponse mirrors cachekv.Metrics.
message GetMetricsResponse {
  uint64 total_operations = 1;
  uint64 created = 2;
  uint64 reads = 3;
  uint64 writes = 4;
  uint64 deletes = 5;
  uint64 errors = 6;
  int64 databases_active = 7;
  google.protobuf.Duration mean_latency = 8;
  google.protobuf.Duration p50_latency = 9;
  google.protobuf.Duration p95_latency = 10;
  google.protobuf.Duration p99_latency = 11;
  google.protobuf.Duration uptime = 12;
}

message PingRequest {}

message PingResponse {}
