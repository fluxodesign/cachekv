name: cachekv

services:
  cachekv:
    build:
      context: .
      dockerfile: Dockerfile
    image: cachekv:latest
    container_name: cachekv-server
    restart: unless-stopped

    # Bound to loopback: the gRPC API is unauthenticated and unencrypted, so it
    # should not be reachable from outside the host by default. Drop the
    # "127.0.0.1:" prefix only once you have TLS/auth in front of it.
    ports:
      - "127.0.0.1:50051:50051"

    # One volume at /data holds both the databases (/data/store) and the keyring
    # (/data/keys). Back them up together and never separately: a secure
    # database is unrecoverable without the keyring that holds its key.
    volumes:
      - cachekv-data:/data

    environment:
      # Idle-connection reaping in cachekv's pool; default is 5min.
      POOL_TIMEOUT_MS: "300000"
      # Lets `docker compose exec cachekv cachekv-cli ping` work with no flags.
      CACHEKV_ADDR: "127.0.0.1:50051"

    # The bundled CLI speaks the real gRPC API, so a passing check means the
    # service layer answers — not merely that the port is open.
    healthcheck:
      test: ["CMD", "/usr/local/bin/cachekv-cli", "-timeout", "3s", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Shutdown drains in-flight RPCs for up to 25s, then closes the pool with a
    # 30s budget. The default 10s grace period would SIGKILL it mid-flush.
    stop_grace_period: 60s

    # Hardening: the only writable paths are the data volume and /tmp, which
    # cachekv's startup validation uses for a throwaway badger probe.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Badger memory-maps its LSM tables and value logs across every open
    # database, so the default file-descriptor limit is easy to hit.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cachekv-data:
